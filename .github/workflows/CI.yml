name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Cancel in-progress runs for the same PR / branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use pinned manifest
        run: cp "Manifest-v${{ matrix.version }}.toml.default" "Manifest-v${{ matrix.version }}.toml"

      - name: Install GLMakie system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xorg-dev mesa-utils libgl1 freeglut3-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            xsettingsd x11-xserver-utils

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
          prefix: xvfb-run -a

      - uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: OpenSourceAWE/V3Kite.jl
          files: lcov.info
