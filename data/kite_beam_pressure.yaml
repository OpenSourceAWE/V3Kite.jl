# The beam wing flown on the AeroPressure coupling, which distributes the VSM's
# per-section force over the structural points as a surface traction — the
# transfer this wing is built for, where the particle lattice uses the direct
# one. Identical to kite_beam.yaml apart from `aero_mode`, kept separate because
# it needs a different aero geometry: AeroPressure builds a station-point map
# from per-node Cp/cf tables, which the stock aero_geometry.yaml does not carry.
kite_settings:
  wing_type: particle_dynamics
  aero_mode: pressure
  backend: kernel
  vsm_interval: 1

  body_damping: [0.0, 0.0, 20.0]
  world_damping: [0.0, 0.0, 0.0]

  init_mode: settle
  init_state: relaxed_struc_geometry_beam_dp20.arrow

  adapter_dir: null

  geom:
    reduce_tip: false
    reduce_te: false

  bridle:
    compression_frac: 0.01
    compression_damping_frac: 1.0
    bridle_rel_damping: 0.001
