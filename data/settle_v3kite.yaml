# Settling schedule of the v3kite.jl example, loaded into a `V3SettleConfig` via
# the `settle_settings:` key of a project file. What is settled and at what
# flight condition is not here: the geometry comes from the project file and the
# flight condition from its sim_settings. Only the schedule is, because that is
# what differs between examples rather than between kites.
#
# A kite whose init_mode is `relaxed_state` still reads this file — it settles
# from the relaxed state instead of from the placed geometry, same schedule.
settle_settings:
  num_steps: 40
  num_substeps: 1
  dt: 0.05

  # Body-frame damping decays linearly over decay_steps, floored elementwise at
  # min_damping; world-frame damping decays all the way to zero.
  body_damping: [0.0, 0.0, 40.0]
  min_damping: [0.0, 0.0, 20.0]
  world_damping: [0.0, 0.0, 0.0]
  decay_steps: 30

  course_correction_gain: 0.05
  # :heading tracks the initial heading, for settling from rest; :course tracks
  # the flight-data course and needs a nonzero velocity.
  course_correction_mode: heading
