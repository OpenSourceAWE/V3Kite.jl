# v3kite.jl on the particle lattice. A KiteUtils project file: a section of
# pointers, each choosable on its own, so two examples share the files they
# agree on and differ only where they have to. The beam variant of this run is
# system_beam.yaml, which differs in two lines.
system:
  sim_settings: "sim_settings_v3kite.yaml"
  structural_geometry: "struc_geometry.yaml"
  aero_geometry: "cfd_aero_geometry.yaml"
  vsm_settings: "vsm_settings.yaml"
  wc_settings: "wc_settings.yaml"
  kite_settings: "kite_settings_psm.yaml"
  settle_settings: "settle_settings_default.yaml"
  heading_settings: "heading_settings_psm.yaml"
