# v3kite.jl on the Timoshenko-beam wing. Its aero geometry is generated rather
# than tracked: run v3beam_aero_geometry.jl first. The depower is pinned to the
# 20 % its relaxed state was written at, while the particle run flies 30 %.
system:
  sim_settings: "sim_settings_v3kite_beam.yaml"
  structural_geometry: "struc_geometry_beam.yaml"
  aero_geometry: "nf_aero_geometry.yaml"
  vsm_settings: "vsm_settings.yaml"
  wc_settings: "wc_settings.yaml"
  kite_settings: "kite_settings_beam.yaml"
  settle_settings: "settle_settings_v3kite.yaml"
  heading_settings: "heading_settings_v3kite_beam.yaml"
