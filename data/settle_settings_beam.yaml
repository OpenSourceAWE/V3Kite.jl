# Settling schedule of the Timoshenko-beam wing, loaded into a `V3SettleConfig`
# via the `settle_settings:` key of a project file. The flight condition it
# settles at is not here: that comes from the project's sim_settings.
#
# A beam wing carries its mass in the bodies, and its wing nodes are BODY_STATIC
# points that the point damping cannot reach, so the beam_* ramps below are what
# actually quiets it. Without them the run starts flying a ringing structure and
# the implicit solver spends its whole budget on the transient.
settle_settings:
  num_steps: 300                 # settling steps
  num_substeps: 1                # solver steps per settling step
  dt: 0.05                       # [s] solver step

  body_start_damping: [0.0, 0.0, 40.0]  # wing-frame damping settling starts at
  world_start_damping: [0.0, 0.0, 0.0]  # world-frame damping settling starts at
  beam_body_start_damping: [40.0, 40.0, 40.0]  # the bodies, relative to the wing
  beam_world_start_damping: [10.0, 10.0, 10.0] # the bodies, on the world axes
  beam_angular_start_damping: [600.0, 600.0, 600.0]  # spin damping of the bodies
  decay_steps: 200               # steps over which they decay to the sim damping

  course_correction_gain: 0.05   # steering gain of the course/heading hold
  course_correction_mode: heading  # heading (from rest) | course (from a log)

  kcu_mass: null                 # [kg] overrides the kcu_mass of the settings
  start_depower: null            # [%] depower the settling ramp starts at
  end_depower: null              # [%] depower the settling ramp ends at
  fix_sphere_idxs: []            # points pinned to their sphere while settling
