# flight_replay.jl on the particle lattice; system_beam_replay.yaml is the
# beam variant.
system:
  # A replay takes its wind, tether length and depower from the log row it
  # settles onto, so only elevation and run length come from this file.
  sim_settings: "sim_settings_default.yaml"
  structural_geometry: "struc_geometry.yaml"
  aero_geometry: "cfd_aero_geometry.yaml"
  vsm_settings: "vsm_settings.yaml"
  wc_settings: "wc_settings.yaml"
  kite_settings: "kite_settings_psm_replay.yaml"
  settle_settings: "settle_settings_replay.yaml"
  heading_settings: "heading_settings.yaml"
