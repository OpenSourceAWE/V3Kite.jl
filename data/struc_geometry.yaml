###########################
## Segments ###############
###########################
# Spring-damper connections between points
# Supports two formats:
#   1. Material-based: [id, point_i, point_j, l0, diameter_mm, material, compression_frac]
#      - material is an unquoted string reference (e.g., dyneema)
#      - stiffness is auto-calculated: k = E*A/l0
#   2. Explicit stiffness: [id, point_i, point_j, l0, diameter_mm, unit_stiffness, compression_frac]
#      - unit_stiffness is a number (e.g., 2000.0)
#      - unit_damping defaults to 0.0

segments:
  headers: [name, point_i, point_j, l0, diameter_mm, unit_stiffness, unit_damping, compression_frac]
  data:
    #TODO: stiffness
    # Wing structural elements - leading edge tubes (hardcoded stiffness, not dyneema)
    # =2e6 for stiffness tubular frame
    # =5e5 stiffness wires
    - [le_1_l, le1, le2, 0.984642, 1.0, 1e6, 2e3, 1]
    - [le_2_l, le2, le3, 1.327663, 1.0, 1e6, 2e3, 1]
    - [le_3_l, le3, le4, 1.326240, 1.0, 1e6, 2e3, 1]
    - [le_4_l, le4, le5, 1.323655, 1.0, 1e6, 2e3, 1]
    - [le_5, le5, le6, 1.347595, 1.0, 1e6, 2e3, 1]
    - [le_4_r, le6, le7, 1.323655, 1.0, 1e6, 2e3, 1]
    - [le_3_r, le7, le8, 1.326240, 1.0, 1e6, 2e3, 1]
    - [le_2_r, le8, le9, 1.327663, 1.0, 1e6, 2e3, 1]
    - [le_1_r, le9, le10, 0.984642, 1.0, 1e6, 2e3, 1]

    #TODO: stiffness
    # Wing structural elements - struts (chords, hardcoded stiffness)
    - [strut_1_l, le1, te1, 1.074728, 1.0, 1e6, 2e3, 1]
    - [strut_2_l, le2, te2, 1.511911, 1.0, 1e6, 2e3, 1]
    - [strut_3_l, le3, te3, 1.960560, 1.0, 1e6, 2e3, 1]
    - [strut_4_l, le4, te4, 2.154185, 1.0, 1e6, 2e3, 1]
    - [strut_5_l, le5, te5, 2.265501, 1.0, 1e6, 2e3, 1]
    - [strut_5_r, le6, te6, 2.265501, 1.0, 1e6, 2e3, 1]
    - [strut_4_r, le7, te7, 2.154185, 1.0, 1e6, 2e3, 1]
    - [strut_3_r, le8, te8, 1.960560, 1.0, 1e6, 2e3, 1]
    - [strut_2_r, le9, te9, 1.511911, 1.0, 1e6, 2e3, 1]
    - [strut_1_r, le10, te10, 1.074728, 1.0, 1e6, 2e3, 1]

    #TODO: stiffness ratio between LE+struts & wires is crucial for stability
    # Wing structural elements - trailing edge wires (hardcoded stiffness)
    - [te_1_l, te1, te2, 0.9039, 1.0, 5e5, 5e5, 0.100]
    - [te_2_l, te2, te3, 1.3511, 1.0, 5e5, 5e5, 0.100]
    - [te_3_l, te3, te4, 1.3506, 1.0, 5e5, 5e5, 0.100]
    - [te_4_l, te4, te5, 1.3505, 1.0, 5e5, 5e5, 0.100]
    - [te_5, te5, te6, 1.3211, 1.0, 5e5, 5e5, 0.100]
    - [te_4_r, te6, te7, 1.3211, 1.0, 5e5, 5e5, 0.100]
    - [te_3_r, te7, te8, 1.3506, 1.0, 5e5, 5e5, 0.100]
    - [te_2_r, te8, te9, 1.3511, 1.0, 5e5, 5e5, 0.100]
    - [te_1_r, te9, te10, 0.9039, 1.0, 5e5, 5e5, 0.100]

    # Wing structural elements - diagonal springs (hardcoded stiffness)
    - [dia_1a_l, le1, te2, 1.3604, 1.0, 5e5, 5e5, 0.100]
    - [dia_1b_l, te1, le2, 1.78, 1.0, 5e5, 5e5, 0.100]
    - [dia_2a_l, le2, te3, 2.1081, 1.0, 5e5, 5e5, 0.100]
    - [dia_2b_l, te2, le3, 2.2515, 1.0, 5e5, 5e5, 0.100]
    - [dia_3a_l, le3, te4, 2.4492, 1.0, 5e5, 5e5, 0.100]
    - [dia_3b_l, te3, le4, 2.4555, 1.0, 5e5, 5e5, 0.100]
    - [dia_4a_l, le4, te5, 2.601, 1.0, 5e5, 5e5, 0.100]
    - [dia_4b_l, te4, le5, 2.5631, 1.0, 5e5, 5e5, 0.100]
    - [dia_5a, le5, te6, 2.6292, 1.0, 5e5, 5e5, 0.100]
    - [dia_5b, te5, le6, 2.6292, 1.0, 5e5, 5e5, 0.100]
    - [dia_4b_r, le6, te7, 2.5631, 1.0, 5e5, 5e5, 0.100]
    - [dia_4a_r, te6, le7, 2.601, 1.0, 5e5, 5e5, 0.100]
    - [dia_3b_r, le7, te8, 2.4555, 1.0, 5e5, 5e5, 0.100]
    - [dia_3a_r, te7, le8, 2.4492, 1.0, 5e5, 5e5, 0.100]
    - [dia_2b_r, le8, te9, 2.2515, 1.0, 5e5, 5e5, 0.100]
    - [dia_2a_r, te8, le9, 2.1081, 1.0, 5e5, 5e5, 0.100]
    - [dia_1b_r, le9, te10, 1.78, 1.0, 5e5, 5e5, 0.100]
    - [dia_1a_r, te9, le10, 1.3604, 1.0, 5e5, 5e5, 0.100]
    - [a5_equiv_l1, le1, bp5, 5.964, 2.0, dyneema, nothing, 0.01] # AIII/Br,main,2 or a6 first half (pulley)
    - [a5_equiv_l2, le1, bp13, 5.964, 2.0, dyneema, nothing, 0.01] # AIII/Br,main,2 or a6 second half (pulley)

    # A4  TODO: estimation
    # direct laser measurement --> 2910 mm
    # indirect --> A4 + 0.5* a4/b4 = 2877+0.5*220 = 2987.0
    - [a4_equiv_l, le2, bp1, 2.987, 3.0, dyneema, nothing, 0.01] # A4 or A5

    # A3 TODO: estimation
    # direct laser measurement -->3450 mm
    # indirect --> A3 + 0.54 *ab3/cd3 + 0.5*a3/b3 = 1791 + 0.54*3076 + 0.5*325 = 3614.54
    - [a3_equiv_l, le3, bp1, 3.61454, 3.0, dyneema, nothing, 0.01] # A3

    # A2 #TODO: estimation
    # direct laser measurement --> 3550 mm
    # indirect --> A2 + 0.54*ab2/cd2 +0.5 *a2/b2 = 1798 + 0.54*3180+0.5*260 = 3645.2
    - [a2_equiv_l, le4, bp2, 3.6452, 3.0, dyneema, nothing, 0.01] # A2

    # A1 #TODO: laser measurement
    # direct laser measurement --> 3710 mm
    # indirect -->  A1 +0.54*ab1/cd1 +0.5*a1/b1 = 1860 +0.54*3261+0.5*330 = 3785.94
    - [a1_equiv_l, le5, bp2, 3.78594, 3.0, dyneema, nothing, 0.01] # A1

    # Bridle segments - left rear lines (mirror, non-compressive, using dyneema)
    - [a1_equiv_r, le6, bp3, 3.78594, 3.0, dyneema, nothing, 0.01] # A1
    - [a2_equiv_r, le7, bp3, 3.6452, 3.0, dyneema, nothing, 0.01] # A2
    - [a3_equiv_r, le8, bp4, 3.61454, 3.0, dyneema, nothing, 0.01] # A3
    - [a4_equiv_r, le9, bp4, 2.987, 3.0, dyneema, nothing, 0.01] # A4 or A5- original 2.782
    - [a5_equiv_r1, bp6, le10, 5.964, 2.0, dyneema, nothing, 0.01] # a6 first half (pulley)
    - [a5_equiv_r2, le10, bp15, 5.964, 2.0, dyneema, nothing, 0.01] # a6 second half (pulley)

    # Bridle convergence - left side (non-compressive, using dyneema)
    - [aii_l, bp1, bp5, 3.36, 5.0, dyneema, nothing, 0.01] # AII outer
    - [ai_l, bp2, bp5, 3.67, 5.0, dyneema, nothing, 0.01] # AI inner
    - [ai_r, bp3, bp6, 3.67, 5.0, dyneema, nothing, 0.01] # AI inner
    - [aii_r, bp4, bp6, 3.36, 5.0, dyneema, nothing, 0.01] # AII outer

    # Main power lines to KCU (non-compressive, using dyneema)
    - [a_main_l, bp5, kcu, 3.903, 6.0, dyneema, nothing, 0.01] # amain
    - [a_main_r, bp6, kcu, 3.903, 6.0, dyneema, nothing, 0.01] # amain

    # Bridle segments - right front lines (non-compressive, using dyneema)

    # Br,5 (or br6)
    # Br,5 + 2* br5,e + br5 = 12168 + 2*115+1420 = 13818 mm total, but pulley
    # 13818 / 2 = 6909 mm per half
    - [br_5_equiv_l1, bp13, te1, 6.909, 4.0, dyneema, nothing, 0.01] # Br,5 or br6 first half (pulley)
    - [br_5_equiv_l2, te1, bp16, 6.909, 4.0, dyneema, nothing, 0.01] # Br,5 or br6 second half (pulley)
    - [br_4_l, te2, bp7, 3.550, 2.0, dyneema, nothing, 0.01] # br,4 or br5
    - [br_3_l, te3, bp7, 4.094, 2.0, dyneema, nothing, 0.01] # br,3
    - [br_2_l, te4, bp8, 4.180, 2.0, dyneema, nothing, 0.01] # br,2
    - [br_1_l, te5, bp8, 4.407, 2.0, dyneema, nothing, 0.01] # br,1

    # Bridle segments - right rear lines (mirror, non-compressive, using dyneema)
    - [br_1_r, te6, bp9, 4.407, 2.0, dyneema, nothing, 0.01] # br,1
    - [br_2_r, te7, bp9, 4.180, 2.0, dyneema, nothing, 0.01] # br,2
    - [br_3_r, te8, bp10, 4.094, 2.0, dyneema, nothing, 0.01] # br,3
    - [br_4_r, te9, bp10, 3.550, 2.0, dyneema, nothing, 0.01] # br,4 or br5
    - [br_5_equiv_r1, bp15, te10, 6.909, 4.0, dyneema, nothing, 0.01] # br6 first half (pulley)
    - [br_5_equiv_r2, te10, bp17, 6.909, 4.0, dyneema, nothing, 0.01] # br6 second half (pulley)

    # Bridle convergence - right side (non-compressive, using dyneema)
    - [br_ii_l, bp7, bp11, 2.045, 2.0, dyneema, nothing, 0.01] # BRII (inner)
    - [br_i_l, bp8, bp11, 2.333, 2.0, dyneema, nothing, 0.01] # BRI (outer)
    - [br_i_r, bp9, bp12, 2.333, 2.0, dyneema, nothing, 0.01] # BRI (outer)
    - [br_ii_r, bp10, bp12, 2.045, 2.0, dyneema, nothing, 0.01] # BRII (inner)

    # Right main lines (non-compressive, using dyneema)
    - [br_main_1_l, bp11, bp13, 0.61, 2.0, dyneema, nothing, 0.01] # BR-main-1
    - [br_main_1_r, bp12, bp15, 0.61, 2.0, dyneema, nothing, 0.01] # BR-main-1

    # Central pulley system - M-line (non-compressive, using dyneema)
    # because Br,main,e is not modelled. Some additional length should be added to the M-line.
    # it is under a supposably 20deg angle
    # 0deg would mean the addition was 2x70mm
    # at 80deg we get, 70/cos(10deg) = 71mm --> addition of 2x71mm = 0.142m
    # that gives us M = 4856+0.142 = 4.998m --> 2499mm per
    - [m_l1, bp16, bp13, 2.499, 4.0, dyneema, nothing, 0.01]     # M-line first half (pulley)
    - [m_l2, bp13, bp14, 2.499, 4.0, dyneema, nothing, 0.01]     # M-line second half (pulley)
    - [m_r1, bp14, bp15, 2.499, 4.0, dyneema, nothing, 0.01]     # M-line first half (pulley)
    - [m_r2, bp15, bp17, 2.499, 4.0, dyneema, nothing, 0.01]     # M-line second half (pulley)

    # Final attachment to KCU/tethers (non-compressive, using dyneema)
    # In reality theses are 12mmx1.5mm, we use the equilavelent diameter ~ 4.8mm so we take 5mm
    - [steering_tape_l, bp16, kcu, 1.6, 5.0, dyneema, nothing, 0.01] # Steering Tape
    - [depower_tape, bp14, kcu, 2.2, 5.0, dyneema, nothing, 0.01] # Power Tape
    - [steering_tape_r, bp17, kcu, 1.6, 5.0, dyneema, nothing, 0.01] # Steering Tape

###########################
## Pulleys ################
###########################
# Pulleys enforce equal tension constraints
# headers: [id, segment_i, segment_j, type]
# type: DYNAMIC, QUASI_STATIC

pulleys:
  headers: [idx, segment_i, segment_j, type]
  data:
    - [1, a5_equiv_l2, a5_equiv_l1, DYNAMIC] # a6 left front pulley
    - [2, a5_equiv_r1, a5_equiv_r2, DYNAMIC] # a6 left rear pulley
    - [3, br_5_equiv_l1, br_5_equiv_l2, DYNAMIC] # br6 right front pulley
    - [4, br_5_equiv_r1, br_5_equiv_r2, DYNAMIC] # br6 right rear pulley
    - [5, m_l1, m_l2, DYNAMIC]         # M-line front pulley
    - [6, m_r1, m_r2, DYNAMIC]         # M-line rear pulley

###########################
## Groups #################
###########################
# Deformable wing sections with twist dynamics
# headers: [id, point_idxs, gamma, type, reference_chord_frac]
# type: DYNAMIC, QUASI_STATIC

groups:
  headers: [idx, point_idxs, gamma, type, reference_chord_frac]
  data:
    # Note: groups would be defined here if using deformable wing model
    # For a rigid structure, this can be empty or omitted

###########################
## Tethers ################
###########################
# Collections of segments forming tether lines
# headers: [id, segment_idxs]
# winch_point moved to Winch in v0.8.0

tethers:
  headers: [idx, start_point, end_point, n_segments, material, diameter_mm, init_stretched_length]
  data:
    - [1, kcu, anchor, 6, dyneema, .nan, 100.0] # diameter_mm: .nan → use set.d_tether

###########################
## Winches ################
###########################
# Ground-based winches controlling tethers
# headers: [id, tether_ids]

winches:
  headers: [idx, tether_idxs, winch_point]
  data:
    - [1, [1], anchor]

###########################
## Wings ##################
###########################
# Wing aerodynamic bodies
# headers: [id, type, point_idxs]
# type: PARTICLE_DYNAMICS or RIGID_DYNAMICS
# point_idxs: List of WING-type points (for PARTICLE_DYNAMICS: must be LE/TE pairs)

wings:
  data:
    # RIGID_DYNAMICS wing: Rigid body with twist groups (auto-created from LE/TE pairs)
    # Points 2-21 form 10 LE/TE segment pairs (2,3), ..., (20,21)
    # For RIGID_DYNAMICS wings, use aero_z_offset to shift VSM panels in body frame z
    # For PARTICLE_DYNAMICS wings, use point_idxs, origin_idx, z_ref_points, y_ref_points
    - idx: 1
      type: PARTICLE_DYNAMICS
      point_idxs: [le1, te1, le2, te2, le3, te3, le4, te4, le5, te5, le6, te6, le7, te7, le8, te8, le9, te9, le10, te10]
      origin_idx: kcu
      z_ref_points: [kcu, [[le6, 0.7], [te5, 0.3]]] # KCU to LE for Z (normal)
      y_ref_points: [le6, le5] # Center LE for Y (span)
      aero_scale_chord: 0.129 # Aero Force/Moment multiplier = 1 + value (0.13 -> 1.13x) 12.9% was the delta in projected area
      aero_z_offset: 0.0 # QUATERNION only: shifts VSM panels +z in body frame

###########################
## Transforms #############
###########################
# Spatial transformations for initial positioning
# Each transform defines orientation (elevation, azimuth, heading) relative to a base point
# Required fields: id, elevation, azimuth, heading
# Must provide either (wing_idx OR rot_point_idx) AND (base_pos + base_point_idx OR base_transform_idx)

transforms:
  data:
    # Main transform for v3 kite wing
    - idx: 1
      elevation: 70 # 65 60
      azimuth: 0.0
      heading: 0.0
      wing_idx: 1 # Transform applies to wing 1
      base_pos: [0.0, 0.0, 0.0] # Base position (at KCU/ground point)
      base_point_idx: anchor # Reference to point 39 (ground attachment)
