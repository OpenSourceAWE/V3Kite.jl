    # For a rigid structure, this can be empty or omitted

###########################
## Tethers ################
###########################
# Collections of segments forming tether lines
# headers: [id, segment_idxs]
# winch_point moved to Winch in v0.8.0

tethers:
  headers: [idx, start_point, end_point, n_segments, material, diameter_mm, init_stretched_length]
  data:
    - [1, kcu, anchor, 6, dyneema, .nan, 100.0]  # diameter_mm: .nan → use set.d_tether

###########################
## Winches ################
###########################
# Ground-based winches controlling tethers
# headers: [id, tether_ids]

winches:
  headers: [idx, tether_idxs, winch_point]
  data:
    - [1, [1], anchor]

###########################
## Wings ##################
###########################
# Wing aerodynamic bodies
# headers: [id, type, point_idxs]
# type: PARTICLE_DYNAMICS or RIGID_DYNAMICS
# point_idxs: List of WING-type points (for PARTICLE_DYNAMICS: must be LE/TE pairs)

wings:
  data:
    # RIGID_DYNAMICS wing: Rigid body with twist groups (auto-created from LE/TE pairs)
    # Points 2-21 form 10 LE/TE segment pairs (2,3), ..., (20,21)
    # For RIGID_DYNAMICS wings, use aero_z_offset to shift VSM panels in body frame z
    # For PARTICLE_DYNAMICS wings, use point_idxs, origin_idx, z_ref_points, y_ref_points
    - idx: 1
      type: PARTICLE_DYNAMICS
      point_idxs: [le1, te1, le2, te2, le3, te3, le4, te4, le5, te5, le6, te6, le7, te7, le8, te8, le9, te9, le10, te10]
      origin_idx: kcu
      z_ref_points: [kcu, [[le6, 0.7], [te5, 0.3]]] # KCU to LE for Z (normal)
      y_ref_points: [le6, le5] # Center LE for Y (span)
      aero_scale_chord: 0.129 # Aero Force/Moment multiplier = 1 + value (0.13 -> 1.13x) 12.9% was the delta in projected area
      aero_z_offset: 0.0 # QUATERNION only: shifts VSM panels +z in body frame

###########################
## Transforms #############
###########################
# Spatial transformations for initial positioning
# Each transform defines orientation (elevation, azimuth, heading) relative to a base point
# Required fields: id, elevation, azimuth, heading
# Must provide either (wing_idx OR rot_point_idx) AND (base_pos + base_point_idx OR base_transform_idx)

transforms:
  data:
    # Main transform for v3 kite wing
    - idx: 1
      elevation: 70 # 65 60
      azimuth: 0.0
      heading: 0.0
      wing_idx: 1 # Transform applies to wing 1
      base_pos: [0.0, 0.0, 0.0] # Base position (at KCU/ground point)
      base_point_idx: anchor # Reference to point 39 (ground attachment)
