# v3kite.jl on the Timoshenko-beam wing. Its aero geometry is generated rather
# than tracked: run v3beam_aero_geometry.jl first. The flight condition is the
# particle run's but for the depower, which the relaxed state this wing starts
# from fixes at 20 % (see sim_settings_beam.yaml).
system:
  sim_settings: "sim_settings_beam.yaml"
  structural_geometry: "struc_geometry_beam.yaml"
  aero_geometry: "nf_aero_geometry.yaml"
  vsm_settings: "vsm_settings.yaml"
  wc_settings: "wc_settings.yaml"
  kite_settings: "kite_settings_beam.yaml"
  settle_settings: "settle_settings_beam.yaml"
  heading_settings: "heading_settings_beam.yaml"
